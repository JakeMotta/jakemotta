name: Deploy Website

# Builds the app and uploads build/ to jakemotta.com over FTP with TLS.
#
# It runs on a push to master and on demand from the Actions tab. Only the
# built output is published — the sources, node_modules and .env never leave
# the runner.
#
# Four secrets, under Settings > Secrets and variables > Actions:
#
#   FTP_SERVER      the hostname alone, no scheme and no path
#   FTP_USERNAME    the FTP account
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  where on the server the build lands, e.g. / or /public_html/
#
# FTP_SERVER MUST NOT BE A CLOUDFLARE-PROXIED HOSTNAME. Cloudflare proxies HTTP
# and HTTPS and nothing else, so a proxied name answers on 443 and refuses 21 —
# which is what broke every run of the previous version of this workflow. Point
# it at the host's own server hostname, or at a DNS record with the proxy
# turned off (grey cloud). The preflight step below checks this and says so.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: 'Mirror every project site, not just the ones changed since the last deploy'
        type: boolean
        default: false

# Reading earlier runs is how the upload finds the last deployed commit.
permissions:
  contents: read
  actions: read

# One deploy at a time. Two runs writing the same directory over FTP is how a
# half-uploaded page ends up being served.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    # Generous on purpose. Steady-state deploys move only the changed bundles
    # and take a minute, but the first one may have to push all 1.6GB of
    # projects/ and music/ before --ignore-time has anything to compare
    # against, and a deploy killed halfway is worse than a slow one.
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # The upload's time goes on listing the server, not on sending files:
      # mirror lists every directory it compares, each over a fresh TLS data
      # connection, and projects/ holds 700 of build/'s 720 directories. Those
      # sites almost never change, so only the ones touched since the last
      # successful deploy are mirrored. Anything that can't be worked out
      # falls back to mirroring them all, as every deploy used to.
      - name: Work out which project sites changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.full }}
        run: |
          set -uo pipefail

          full() {
            echo "::notice::Mirroring every project site: $1"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "${FORCE_FULL:-false}" = true ] && full "asked for from the Actions tab"

          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch master --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          [ -n "$last" ] || full "there is no earlier successful deploy to compare with"
          git fetch -q --depth=1 origin "$last" || full "couldn't fetch the last deployed commit, $last"

          # Deletions are left out because the deploy never deletes anything.
          git -c core.quotePath=false diff --name-only --no-renames --diff-filter=d "$last" HEAD -- public/projects/ \
            | cut -d/ -f3 | sort -u > "$RUNNER_TEMP/sites.txt" \
            || full "couldn't compare with $last"

          # The names go into the lftp script in double quotes.
          grep -q '[^A-Za-z0-9._ -]' "$RUNNER_TEMP/sites.txt" && full "a changed site's name needs quoting"

          echo "Last deployed: $last"
          echo "Project sites changed since then: $(grep -c . "$RUNNER_TEMP/sites.txt")"
          cat "$RUNNER_TEMP/sites.txt"
          echo "full=false" >> "$GITHUB_OUTPUT"

      # Fail here with an explanation rather than 40 lines down with a bare
      # "Connection refused". The Cloudflare case is the one that has actually
      # happened, and it is invisible from the error lftp gives.
      - name: Check the FTP host is reachable
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail

          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          if timeout 15 bash -c "</dev/tcp/$FTP_SERVER/21" 2>/dev/null; then
            echo "Port 21 is reachable."
            exit 0
          fi

          # Cloudflare's published ranges begin 104.21, 172.67, 172.64-71 and
          # 2606:4700. Resolving into one of those is the whole explanation.
          # getent is glibc, so it is there on the runner but not on a Mac.
          # The fallbacks keep this diagnostic working wherever it is run from —
          # a resolver that returns nothing turns the useful message below into
          # a shrug.
          ips=$(getent ahosts "$FTP_SERVER" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')
          [ -z "${ips// }" ] && ips=$(dig +short "$FTP_SERVER" A "$FTP_SERVER" AAAA 2>/dev/null | grep -E '^[0-9a-f.:]+$' | sort -u | tr '\n' ' ')
          [ -z "${ips// }" ] && ips=$(python3 -c "import socket,sys;print(' '.join(sorted({a[4][0] for a in socket.getaddrinfo(sys.argv[1],None)})))" "$FTP_SERVER" 2>/dev/null)
          echo "::error::Port 21 on the FTP host is not reachable. Resolved to: ${ips:-nothing}"
          if printf '%s' "$ips" | grep -qE '(^| )(104\.21\.|172\.6[4-9]\.|172\.7[01]\.|2606:4700)'; then
            echo "::error::Those are Cloudflare addresses. Cloudflare proxies HTTP/HTTPS only and does not pass FTP, so port 21 will never answer through it. Set FTP_SERVER to the host's own server hostname, or add a DNS record for FTP with the Cloudflare proxy turned OFF (grey cloud, not orange)."
          fi
          exit 1

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Upload build/ to the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FULL: ${{ steps.changed.outputs.full }}
        run: |
          set -euo pipefail

          # An empty FTP_SERVER_DIR means the account already lands where the
          # site is served from.
          target="${FTP_SERVER_DIR:-/}"
          echo "Uploading ./build/ to $target"

          # The whole session is a script file, and `open` lives inside it.
          # lftp's -f REPLACES the host argument rather than accompanying it —
          # passing both makes lftp hand the -f to `open`, which rejects it with
          # "open: invalid option -- 'f'" and uploads nothing.
          umask 077
          {
            cat <<'LFTP'
          # Explicit FTP over TLS: refuse to send the password on a plain
          # connection, and encrypt the data channel as well as the control one.
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true

          # Fail fast and loudly. reconnect-interval-base defaults to 30s and
          # backs off exponentially, so retries alone sit silent for minutes
          # against an unreachable host — long enough to look like a hang
          # rather than a wrong hostname.
          set net:max-retries 2
          set net:timeout 10
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set cmd:fail-exit true
          LFTP

            # --env-password takes the password out of LFTP_PASSWORD, so it is
            # never written into this file and never appears in the process
            # list. It is in lftp's man page but not in `help open`.
            printf "open -u '%s' --env-password %s\n" "$FTP_USERNAME" "ftp://$FTP_SERVER"

            # --reverse uploads. There is deliberately no --delete: nothing
            # already on the server is removed, so the standalone sites under
            # /projects/ and anything else up there survive a deploy. The cost
            # is that superseded bundles accumulate, which is harmless — every
            # build names its files by content hash, so nothing stale is served.
            #
            # --ignore-time compares size alone, and it is what makes this
            # deploy finish at all. build/ is 1.6GB, nearly all of it the
            # unchanging sites under projects/ and the audio under music/ —
            # and CI regenerates the whole tree with fresh timestamps every
            # run, so the default time comparison would call all 1.6GB new and
            # re-upload it on every push. Size alone is safe for the bundles
            # because a changed bundle gets a new hashed filename.
            mirror="mirror --reverse --verbose --parallel=2 --ignore-time --exclude-glob '.DS_Store'"
            if [ "$FULL" = true ]; then
              printf "%s ./build/ %s\n" "$mirror" "$target"
            else
              # Everything but projects/, then each project site that changed
              # since the last deploy (see "Work out which project sites
              # changed"). mirror creates a new site's folder itself.
              printf "%s --exclude '^projects/' ./build/ %s\n" "$mirror" "$target"
              projects="${target%/}/projects"
              while IFS= read -r site; do
                if [ -d "build/projects/$site" ]; then
                  printf '%s "./build/projects/%s/" "%s/%s/"\n' "$mirror" "$site" "$projects" "$site"
                elif [ -f "build/projects/$site" ]; then
                  printf 'put -O "%s/" "./build/projects/%s"\n' "$projects" "$site"
                fi
                # Neither: a file the build prunes, such as a .php.
              done < "$RUNNER_TEMP/sites.txt"
            fi

            # The exception that --ignore-time would silently break. Both of
            # these are rewritten by every build and both can come out the
            # exact same length, because all that changed inside them is a
            # fixed-width content hash. Compared by size they look untouched,
            # so the server would keep serving an index.html pointing at
            # bundles that no longer exist. Upload them unconditionally.
            printf "put -O %s ./build/index.html\n" "$target"
            printf "put -O %s ./build/asset-manifest.json\n" "$target"

            # The privacy policy is edited in place under a fixed name, so a
            # reworded sentence of the same length would never go up either.
            # Google's OAuth app for the YouTube Music sync links to it.
            printf "put -O %s ./build/privacy.html\n" "$target"

            # The sitemap is rewritten by every build under the same name, and
            # a renamed project can leave it the same length.
            printf "put -O %s ./build/sitemap.xml\n" "$target"

            # The same goes for the modpack's release pointers: going from
            # 1.0.0-rc.1 to 1.0.0-rc.2 changes them without changing their
            # length. The versioned archives they point at are new paths and
            # need no help.
            packs="${target%/}/downloads/progression-survival/"
            for file in releases.json latest.json .htaccess; do
              printf "put -O %s ./build/downloads/progression-survival/%s\n" "$packs" "$file"
            done

            # The Ambii Business demos are prebuilt apps under projects/, and
            # each app's index.html names its hashed bundles the same way
            # build/index.html does, so a rebuild can change it without
            # changing its length. The hub page is edited by hand. Upload all
            # of them every time too.
            ambii="${target%/}/projects/ambii-business"
            for file in index.html dashboard/index.html player/index.html mobile/index.html mobile/app/index.html; do
              printf "put -O %s ./build/projects/ambii-business/%s\n" "$(dirname "$ambii/$file")/" "$file"
            done

            # Asteroids' game data is re-exported under the same name, and the
            # 2026-10-27 re-export (sharper rendering) came out exactly the
            # same length as the one before it. It's under 1 MB, so it goes
            # up every time.
            printf "put -O %s ./build/projects/asteroids/index.pck\n" "${target%/}/projects/asteroids/"

            # The Greenfoot games built to JavaScript (yarn projects:greenfoot)
            # name their scripts by content hash, listed in each game's
            # web/manifest.json, which a rebuild can change without changing
            # its length.
            for file in build/projects/*/web/manifest.json; do
              [ -f "$file" ] || continue
              printf "put -O %s ./%s\n" "${target%/}/$(dirname "${file#build/}")/" "$file"
            done

            echo bye
          } > "$RUNNER_TEMP/deploy.lftp"

          LFTP_PASSWORD="$FTP_PASSWORD" lftp -f "$RUNNER_TEMP/deploy.lftp"
