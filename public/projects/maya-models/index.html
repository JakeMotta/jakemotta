    html, body { margin: 0; background: #17171a; color: #eee; }
    body { font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 32px 16px 48px; }

    h1 { font-size: 34px; font-weight: 900; margin: 0; }
    .lede { margin: 4px 0 28px; color: #9a9aa3; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 22px; }
    figure { margin: 0; }
    figure a { display: block; background: #000; padding: 6px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
    figure:nth-child(odd) a { transform: rotate(-.6deg); }
    figure:nth-child(even) a { transform: rotate(.5deg); }
    figure a:hover, figure a:focus-visible { transform: rotate(0) translateY(-4px) scale(1.02); outline: none; box-shadow: 0 10px 24px rgba(0, 0, 0, .6), 0 0 0 2px #e9e9ee; }
    figure img, figure video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; }
    figcaption { font-weight: 800; margin-top: 8px; }
    figcaption span { font-weight: 400; color: #8a8a93; margin-left: 6px; font-size: 14px; }
    dialog { border: 0; border-radius: 8px; padding: 8px; max-width: 96vw; max-height: 96vh; background: #000; color: #eee; }
    dialog::backdrop { background: rgba(0, 0, 0, .8); }
    dialog img, dialog video { display: block; max-width: 94vw; max-height: 86vh; min-width: min(640px, 94vw); object-fit: contain; }
    dialog [hidden] { display: none; }
    dialog p { margin: 0; padding: 6px 4px 0; font-weight: 800; }
    @media (prefers-reduced-motion: reduce) { figure a, figure:nth-child(n) a { transform: none; transition: none; } }
</style>

<dialog id="zoom"><img alt=""><video muted loop playsinline controls hidden></video><p></p></dialog>
<script>
    // Each piece is a plain link to its file; with JS it opens in place instead. A click anywhere
    // but a playing video closes it, and so does Escape.
    var zoom = document.getElementById('zoom');
    var bigImage = zoom.querySelector('img');
    var bigVideo = zoom.querySelector('video');
    document.querySelector('.grid').addEventListener('click', function (event) {
        var link = event.target.closest('a');
        if (!link) return;
        event.preventDefault();
        var small = link.querySelector('img, video');
        var label = small.alt || small.getAttribute('aria-label');
        var isVideo = small.tagName === 'VIDEO';
        bigImage.hidden = isVideo;
        bigVideo.hidden = !isVideo;
        if (isVideo) {
            bigVideo.poster = small.poster;
            bigVideo.src = link.getAttribute('href');
            bigVideo.setAttribute('aria-label', label);
            bigVideo.play().catch(function () {});
        } else {
            bigImage.src = link.getAttribute('href');
            bigImage.alt = label;
        }
        zoom.querySelector('p').textContent = link.parentNode.querySelector('figcaption').firstChild.textContent;
        zoom.showModal();
    });
    zoom.addEventListener('click', function (event) {
        if (event.target !== bigVideo) zoom.close();
    });
    zoom.addEventListener('close', function () {
        bigVideo.pause();
        bigVideo.removeAttribute('src');
        bigVideo.load();
    });

    // The turntables in the grid play while they're on screen and rest when they're not. With
    // reduced motion they keep still until one is opened.
    var turntables = document.querySelectorAll('.grid video');
    var stayStill = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if ('IntersectionObserver' in window && !stayStill) {
        var watcher = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) entry.target.play().catch(function () {});
                else entry.target.pause();
            });
        });
        turntables.forEach(function (video) { watcher.observe(video); });
    }
</script>
