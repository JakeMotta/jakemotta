<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Me - Upload</title>

<!-- Static archive copy of Upload.php. Handled by js/faceme.js; nothing is uploaded or sent anywhere. -->
<link rel="stylesheet" type="text/css" href="files/cssreset.css">
<link rel="stylesheet" type="text/css" href="files/mainCSS.css">
<link rel="stylesheet" type="text/css" href="files/static.css">
</head>

<body>
    <div id="topnav">
    	<div id="top-box-1" class="class-hover-effect"></div>
        <div id="top-box-2" class="class-hover-effect"></div>
        <div id="top-box-3" class="class-hover-effect"></div>
        <div id="top-box-4" class="class-hover-effect"></div>
        <div id="topnav-content">
            <div id="topnav-text"></div>
        </div>
        <div id="topnav-footer"></div>
    </div>

    <div id="container">
        	<div id="header"><span class="header-text">FACE ME</span></div>
        	<div id="content">
            	<div id="form-holder">
                	<div id="form-header">Upload</div>
                    <div class="demo-note">Demo copy: the file stays on your computer. Only its name is added to My Videos, with the project's sample face data.</div>
                    <form id="upload-form" action="Upload.html" method="POST" enctype="multipart/form-data"><br>
                        <input type="file" name="file" accept="video/*" />
                        <input type="submit" name="submit" value="Upload!" />
                    </form>

                    <div id="upload-gif-div" hidden>
                        <img src="images/loading_list.gif" alt="Processing" />
                        <ol class="pipeline-log" id="pipeline-log" aria-live="polite"></ol>
                    </div>

                    <div id="form-footer"></div>
                </div>
            </div>
    </div>

    <div id="footer">
    	<span class="sub-text grey">
			<table id="f-table">
				<tr>
					<td class="f-table-data"><a class="f-bot-links small-text class-hover-effect" href="Upload.html">Upload</a></td>
                    <td class="f-table-data"><a class="f-bot-links small-text class-hover-effect" href="Videos.html">My Videos</a></td>
					<td class="f-table-data-end"><a class="f-bot-links small-text class-hover-effect" href="logout.html">Log Out</a></td>
				</tr>
			</table>
		</span>
    </div>

<script src="js/faceme.js"></script>
<script>
    var user = FaceMe.requireUser();
    FaceMe.setWelcome(user);
    var form = document.getElementById('upload-form');
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var file = form.elements.file.files && form.elements.file.files[0];
        form.querySelector('input[type=submit]').disabled = true;
        document.getElementById('upload-gif-div').hidden = false;
        var log = document.getElementById('pipeline-log');
        log.innerHTML = '';
        // Dummy Upload.php: only the file's name is used; the file itself is never read or sent.
        FaceMe.fakeUpload(
            user,
            file ? file.name : 'sample_clip.mp4',
            function (step) {
                var li = document.createElement('li');
                li.textContent = step;
                log.appendChild(li);
            },
            function (entry) {
                window.location.href = 'Output.html?v=' + encodeURIComponent(entry.id);
            }
        );
    });
</script>
</body>
</html>
