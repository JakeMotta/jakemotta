<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice · Ambii</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="media/brand/ambii-logo-120.jpg" />
    <!--
      The demo's stand-in for Stripe's hosted invoice page: every demo invoice's hosted_invoice_url points here
      (invoice.html?id=<invoice id>), and the dashboard's Settings > Invoices opens it in a new tab.
      Hand-written, not built. It reads the invoice from the mock's localStorage ("ambii-demo:invoices", a map of
      id to Stripe-shaped invoice, written by demos/ambii/mock-server/core/seed.js addInvoice) and loads nothing
      from anywhere else.
    -->
    <style>
      :root {
        --ground: #f3eef6;
        --paper: #ffffff;
        --ink: #241b2b;
        --muted: #6f6178;
        --line: #e7dfec;
        --pink: #d04283;
        --violet: #b46fe0;
        --paid: #1f8a5b;
        --paid-bg: #e3f5ec;
        --open: #c2264f;
        --open-bg: #fbe6ec;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--ground);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background:
          radial-gradient(900px 420px at 0% -10%, rgba(208, 66, 131, 0.16), transparent 60%),
          radial-gradient(800px 420px at 100% 0%, rgba(180, 111, 224, 0.16), transparent 60%),
          var(--ground);
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }

      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      .bar a,
      .bar button {
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        background: none;
        border: 0;
        padding: 6px 0;
        cursor: pointer;
      }

      .bar a:hover,
      .bar button:hover {
        color: var(--pink);
      }

      .paper {
        background: var(--paper);
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(36, 27, 43, 0.06), 0 12px 40px rgba(36, 27, 43, 0.08);
        padding: 32px;
      }

      .head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img {
        width: 48px;
        height: 48px;
        border-radius: 14px;
      }

      .brand strong {
        display: block;
        font-size: 20px;
        line-height: 1.1;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      .title {
        text-align: right;
      }

      .title h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.01em;
      }

      .title .number {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .status {
        display: inline-block;
        margin-top: 6px;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status.paid {
        color: var(--paid);
        background: var(--paid-bg);
      }

      .status.open {
        color: var(--open);
        background: var(--open-bg);
      }

      .amount {
        margin: 28px 0 4px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .amount-note {
        margin: 0;
        color: var(--muted);
      }

      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin: 28px 0;
        padding: 20px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .facts h2 {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .facts p {
        margin: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: left;
        padding: 0 0 8px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th.num,
      td.num {
        text-align: right;
        padding-left: 12px;
        white-space: nowrap;
      }

      td small {
        display: block;
        color: var(--muted);
      }

      .totals {
        width: min(100%, 320px);
        margin: 16px 0 0 auto;
      }

      .totals div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 0;
        font-variant-numeric: tabular-nums;
      }

      .totals .due {
        margin-top: 4px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-weight: 800;
      }

      .demo {
        margin: 28px 0 0;
        padding: 14px 16px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(208, 66, 131, 0.08), rgba(180, 111, 224, 0.1));
        color: var(--muted);
        font-size: 14px;
      }

      .demo strong {
        color: var(--pink);
      }

      .missing h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .missing ul {
        padding-left: 20px;
      }

      .missing a {
        color: var(--pink);
        font-weight: 600;
      }

      @media (max-width: 520px) {
        .paper {
          padding: 22px 18px;
        }

        .title {
          text-align: left;
        }

        th.unit,
        td.unit {
          display: none;
        }
      }

      @media print {
        html,
        body {
          background: #fff;
        }

        main {
          padding: 0;
        }

        .bar {
          display: none;
        }

        .paper {
          box-shadow: none;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bar">
        <a href="index.html">Ambii Business demo</a>
        <button type="button" id="print" hidden>Print</button>
      </div>
      <div class="paper" id="invoice" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var STORAGE_KEY = 'ambii-demo:invoices';
        var root = document.getElementById('invoice');

        function el(tag, attrs, children) {
          var node = document.createElement(tag);
          Object.keys(attrs || {}).forEach(function (k) {
            if (k === 'text') node.textContent = attrs[k];
            else if (k === 'className') node.className = attrs[k];
            else node.setAttribute(k, attrs[k]);
          });
          (children || []).forEach(function (c) {
            if (c !== null && c !== undefined && c !== false) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
          });
          return node;
        }

        function readInvoices() {
          try {
            var map = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || '{}') || {};
            return Object.keys(map).map(function (k) { return map[k]; }).filter(function (i) { return i && typeof i === 'object'; });
          } catch (e) {
            return [];
          }
        }

        function money(cents, currency) {
          var n = (Number(cents) || 0) / 100;
          try {
            return n.toLocaleString('en-US', { style: 'currency', currency: String(currency || 'usd').toUpperCase() });
          } catch (e) {
            return '$' + n.toFixed(2);
          }
        }

        function day(seconds) {
          if (!seconds) return '';
          return new Date(Number(seconds) * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // No-break spaces keep "Oct 27, 2026" on one line when a date range wraps
        function shortDay(seconds) {
          if (!seconds) return '';
          return new Date(Number(seconds) * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).replace(/ /g, String.fromCharCode(160));
        }

        function brandName(brand) {
          var b = String(brand || 'card');
          return b.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
        }

        function header(inv) {
          var status = inv.status === 'paid' ? 'paid' : 'open';
          return el('div', { className: 'head' }, [
            el('div', { className: 'brand' }, [
              el('img', { src: 'media/brand/ambii-logo-120.jpg', alt: '', width: '48', height: '48' }),
              el('div', {}, [el('strong', { text: inv.account_name || 'Ambii' }), el('span', { text: 'Background music for business' })]),
            ]),
            el('div', { className: 'title' }, [
              el('h1', { text: 'Invoice' }),
              el('div', { className: 'number', text: inv.number || inv.id }),
              el('span', { className: 'status ' + status, text: status === 'paid' ? 'Paid' : 'Open' }),
            ]),
          ]);
        }

        function fact(title, lines) {
          return el('div', {}, [el('h2', { text: title })].concat(lines.filter(Boolean).map(function (l) { return el('p', { text: l }); })));
        }

        function render(inv) {
          var paid = inv.status === 'paid';
          var currency = inv.currency || 'usd';
          var addr = inv.customer_address || {};
          var card = inv.default_payment_method && inv.default_payment_method.card;
          var paidAt = inv.status_transitions && inv.status_transitions.paid_at;
          var lines = (inv.lines && inv.lines.data) || [];

          document.title = 'Invoice ' + (inv.number || inv.id) + ' · Ambii';
          root.textContent = '';
          root.appendChild(header(inv));
          root.appendChild(el('p', { className: 'amount', text: money(paid ? inv.amount_paid : inv.amount_remaining !== undefined ? inv.amount_remaining : inv.amount_due, currency) }));
          root.appendChild(el('p', { className: 'amount-note', text: paid ? 'Paid on ' + day(paidAt || inv.created) : 'Due now. The card on file is charged automatically.' }));

          root.appendChild(el('div', { className: 'facts' }, [
            fact('Billed to', [inv.customer_name, addr.line1, addr.line2, [addr.city, addr.state, addr.postal_code].filter(Boolean).join(', '), inv.customer_email]),
            fact('Invoice details', ['Issued ' + day(inv.created), inv.period_start && inv.period_end ? 'Service ' + shortDay(inv.period_start) + ' to ' + shortDay(inv.period_end) : '']),
            fact('Payment', [card ? brandName(card.brand) + ' ending in ' + card.last4 : 'Card on file', paid ? 'Charged automatically' : 'Payment pending']),
          ]));

          var body = el('tbody', {}, lines.map(function (line) {
            var unit = line.price && line.price.unit_amount !== undefined ? line.price.unit_amount : line.quantity ? line.amount / line.quantity : line.amount;
            var period = line.period && line.period.start ? shortDay(line.period.start) + ' to ' + shortDay(line.period.end) : '';
            return el('tr', {}, [
              el('td', {}, ['Ambii Premium, per location', el('small', { text: period ? 'Monthly · ' + period : 'Monthly' })]),
              el('td', { className: 'num', text: String(line.quantity || 1) }),
              el('td', { className: 'num unit', text: money(unit, currency) }),
              el('td', { className: 'num', text: money(line.amount, currency) }),
            ]);
          }));
          root.appendChild(el('table', {}, [
            el('thead', {}, [el('tr', {}, [
              el('th', { text: 'Description' }), el('th', { className: 'num', text: 'Qty' }), el('th', { className: 'num unit', text: 'Unit price' }), el('th', { className: 'num', text: 'Amount' }),
            ])]),
            body,
          ]));

          root.appendChild(el('div', { className: 'totals' }, [
            el('div', {}, [el('span', { text: 'Subtotal' }), el('span', { text: money(inv.subtotal, currency) })]),
            el('div', {}, [el('span', { text: 'Total' }), el('span', { text: money(inv.total, currency) })]),
            el('div', {}, [el('span', { text: 'Amount paid' }), el('span', { text: money(inv.amount_paid, currency) })]),
            el('div', { className: 'due' }, [el('span', { text: 'Amount due' }), el('span', { text: money(paid ? 0 : inv.amount_remaining !== undefined ? inv.amount_remaining : inv.amount_due, currency) })]),
          ]));

          root.appendChild(el('p', { className: 'demo' }, [
            el('strong', { text: 'Demo invoice. ' }),
            'I made this one up for the demo, and it lives only in your browser, so no card was charged. The real Ambii billed through Stripe, and its invoices opened right here.',
          ]));

          var print = document.getElementById('print');
          print.hidden = false;
          print.onclick = function () { window.print(); };
        }

        function renderMissing(id, all) {
          document.title = (id ? 'Invoice not found' : 'Demo invoices') + ' · Ambii';
          root.textContent = '';
          root.className = 'paper missing';
          root.appendChild(el('h1', { text: id ? 'Invoice not found' : 'Demo invoices' }));
          root.appendChild(el('p', {
            text: all.length
              ? (id ? "That invoice isn't in this browser. These are the ones that are:" : 'These are the demo invoices in this browser:')
              : 'This browser has no demo invoices yet. Open the dashboard (Settings, then Invoices) and pick one there.',
          }));
          if (all.length) {
            all.sort(function (a, b) { return (b.created || 0) - (a.created || 0); });
            root.appendChild(el('ul', {}, all.map(function (inv) {
              return el('li', {}, [
                el('a', { href: '?id=' + encodeURIComponent(inv.id || inv._id), text: (inv.number || inv.id) + ', ' + day(inv.created) }),
                ' · ' + money(inv.total, inv.currency) + (inv.status === 'paid' ? '' : ' (open)'),
              ]);
            })));
          }
          root.appendChild(el('p', {}, [el('a', { href: 'dashboard/index.html', text: 'Open the dashboard' })]));
        }

        var id = '';
        try {
          id = new URLSearchParams(window.location.search).get('id') || '';
        } catch (e) {
          id = '';
        }
        var all = readInvoices();
        var found = null;
        for (var i = 0; i < all.length; i++) {
          if (id && (all[i].id === id || all[i]._id === id)) found = all[i];
        }
        if (found) render(found);
        else renderMissing(id, all);
      })();
    </script>
  </body>
</html>
