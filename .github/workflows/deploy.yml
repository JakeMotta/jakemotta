name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Debug FTP connectivity
        run: |
          echo "Resolving DNS..."
          getent hosts "${{ secrets.FTP_SERVER }}" || echo "DNS lookup FAILED"
          echo ""
          echo "Testing TCP connection to port 21..."
          timeout 10 bash -c "</dev/tcp/${{ secrets.FTP_SERVER }}/21" \
            && echo "Port 21 reachable" \
            || echo "Port 21 NOT reachable"
          echo ""
          echo "Testing FTPS handshake..."
          timeout 15 openssl s_client -connect "${{ secrets.FTP_SERVER }}:21" -starttls ftp -servername "${{ secrets.FTP_SERVER }}" < /dev/null 2>&1 | head -20 || echo "FTPS handshake FAILED"

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./build/
          protocol: ftps
          port: 21
          timeout: 60000
          log-level: verbose
