<script>
(function () {
    var stars = document.querySelectorAll('#jf-21578602597160 .jf-star');
    var picked = 0;
    var show = function (n) {
        for (var i = 0; i < stars.length; i++) stars[i].className = 'jf-star' + (i < n ? ' jf-on' : '');
    };
    for (var i = 0; i < stars.length; i++) {
        (function (n) {
            stars[n - 1].onmouseover = function () { show(n); };
            stars[n - 1].onmouseout = function () { show(picked); };
            stars[n - 1].onclick = function () { picked = n; show(n); };
        })(i + 1);
    }
})();
</script>
