name: Sync iPhone YouTube Music plays

# Copies YouTube Music plays into ListenBrainz every 30 minutes, for the plays nothing can scrobble as
# they happen: the iPhone app's. The work is in scripts/ytmusic-sync/sync.py, and docs/listening.md
# explains where it fits and what it can't know.
#
# Four secrets, under Settings > Secrets and variables > Actions:
#
#   LISTENBRAINZ_TOKEN     the user token from listenbrainz.org/settings
#   YTMUSIC_CLIENT_ID      the Google OAuth client (type "TVs and Limited Input devices")
#   YTMUSIC_CLIENT_SECRET  its secret
#   YTMUSIC_OAUTH_JSON     the whole of the oauth.json that `ytmusicapi oauth` writes
#
# While none of them are set, the job says so and passes, so it doesn't fail every half hour before
# the sync is set up. With only some set, it fails and names the missing ones.
#
# THIS REPOSITORY IS PUBLIC, AND SO ARE THESE LOGS. Nothing here may print a secret. The script prints
# only song titles, which ListenBrainz publishes anyway.
#
# GitHub starts scheduled runs late when it's busy, and turns the schedule off after 60 days without
# a commit to the repository (it emails a warning first). Either way plays aren't lost, only late: the
# next run picks up anything from today or yesterday.

on:
  schedule:
    # Off the hour, when GitHub's queue is shortest
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be added, without adding it
        type: boolean
        default: false

# One run at a time, so two can't both decide the same song is new
concurrency:
  group: ytmusic-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Copy new plays into ListenBrainz
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/ytmusic-sync/requirements.txt

      - name: Install ytmusicapi
        run: pip install --quiet -r scripts/ytmusic-sync/requirements.txt

      - name: Sync
        env:
          LISTENBRAINZ_TOKEN: ${{ secrets.LISTENBRAINZ_TOKEN }}
          YTMUSIC_CLIENT_ID: ${{ secrets.YTMUSIC_CLIENT_ID }}
          YTMUSIC_CLIENT_SECRET: ${{ secrets.YTMUSIC_CLIENT_SECRET }}
          YTMUSIC_OAUTH_JSON: ${{ secrets.YTMUSIC_OAUTH_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/ytmusic-sync/sync.py
